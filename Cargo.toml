[package]
name = "coffee-sim"
version = "0.1.0"
edition = "2021"

# The root package is also the workspace root (single crate, per ARCHITECTURE.md §4).
[workspace]

[dependencies]
wgpu = "29.0.1"
pollster = "0.4"
bytemuck = { version = "1.25", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
glam = "0.30"
winit = "0.30"
