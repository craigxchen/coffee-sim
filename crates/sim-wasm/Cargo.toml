[package]
name = "coffee-sim-wasm"
version = "0.1.0"
edition = "2021"

[features]
native-profiler = []

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "profile_solvers"
path = "src/bin/profile_solvers.rs"
required-features = ["native-profiler"]

[dependencies]
coffee-sim-core = { path = "../sim-core", default-features = false }
wasm-bindgen = "0.2"
wgpu = "29.0.1"
bytemuck = { version = "1.24", features = ["derive"] }
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["HtmlCanvasElement"] }
console_error_panic_hook = "0.1"
js-sys = "0.3"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
pollster = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
naga = { version = "29.0.1", features = ["wgsl-in"] }
