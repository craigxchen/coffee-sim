  <rect class="note" x="80" y="590" width="560" height="84"/>
  <text class="label" x="102" y="620">Current center of gravity</text>
  <text class="small" x="102" y="644">Pressure solver migration lives mostly in ORCH + SHADER + GPU buffers/pipelines.</text>
  <text class="small" x="102" y="662">Physics tests and profiler/debug tools are the main feedback loop.</text>

  <rect class="panel" x="40" y="735" width="1720" height="455"/>
  <text class="section" x="70" y="775">2. Development Lanes and Progress</text>
  <text class="small" x="70" y="800">Commit tags show where each lane is changing the functional blocks above.</text>

